name: CI
on:
  push:
    branches: [main, develop, wip-stash-restore, audit-fixes]
  pull_request:
jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: App/househelp-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      # -race catches the concurrency bugs the audit dug up; -short skips
      # the integration tests that need testcontainers (audit NEW-E3-003).
      - run: go test ./... -short -race
      # govulncheck reports known CVEs in compiled-in deps. Non-blocking
      # for now so the alert surfaces without breaking unrelated PRs;
      # promote to failing once known issues are addressed.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
        continue-on-error: true
  crm:
    name: CRM (Vite/React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: App/zopmop-crm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: App/zopmop-crm/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Non-blocking npm audit — promote to failing once known issues
      # are resolved (audit NEW-A4-001).
      - name: npm audit (CRM)
        run: npm audit --production --audit-level=moderate
        continue-on-error: true
  migrations:
    name: Migration filename pattern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Audit C-8 / B5-D7 chunk 19: every migration must follow
      # NNN_description.{up,down}.sql so golang-migrate's file source can
      # parse it. Bad: 049_foo.sql, 049_foo.up, 49_foo.up.sql,
      # 049_foo.up.SQL. Good: 049_foo.up.sql, 080_extend_x.down.sql.
      - name: Verify migration filename pattern
        run: |
          cd App/househelp-api
          bad=$(ls migrations/ | grep -v -E '^[0-9]{3}_[a-z0-9_]+\.(up|down)\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "Invalid migration filenames detected:"
            echo "$bad"
            echo
            echo "Expected pattern: NNN_description.{up,down}.sql (3-digit prefix, lowercase + underscores)"
            exit 1
          fi
          echo "All $(ls migrations/ | wc -l) migrations follow NNN_description.{up,down}.sql pattern."
  mobile:
    name: RN app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: App/zopmop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: App/zopmop-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      # Non-blocking npm audit (audit NEW-A4-001).
      - name: npm audit (RN)
        run: npm audit --production --audit-level=moderate
        continue-on-error: true
