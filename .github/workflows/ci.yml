name: CI
on:
  push:
    branches: [main, wip-stash-restore, audit-fixes]
  pull_request:
jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: App/househelp-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -short
  mobile:
    name: RN app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: App/zopmop-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: App/zopmop-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
