<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395.32 395.32" fill="none">
  <!-- Zop group: tilted +10° clockwise to convey sleep. Rotated around the
       viewBox centre so the star stays in frame. -->
  <g transform="rotate(10 197.66 197.66)">
    <!-- Body — verbatim from zop-full.svg -->
    <path d="M178.1,26.44c1.39-5.53,10.07-5.53,11.46,0,24.18,96.14,68.9,141.13,165.61,165.5,5.53,1.39,5.53,10.05,0,11.44-96.73,24.37-141.45,69.36-165.61,165.5-1.39,5.53-10.07,5.53-11.46,0-24.18-96.14-68.9-141.15-165.59-165.5-5.53-1.39-5.53-10.05,0-11.44,96.72-24.37,141.44-69.36,165.6-165.5h-.01Z" fill="#FFBA03"/>

    <!-- Closed eyes (︶ ︶), spread wide -->
    <path d="M108 128 Q 128 152 148 128" stroke="#1F1F1F" stroke-width="13.03" stroke-linecap="round" fill="none"/>
    <path d="M168 128 Q 188 152 208 128" stroke="#1F1F1F" stroke-width="13.03" stroke-linecap="round" fill="none"/>

    <!-- Mouth — verbatim "Default" path from zop-full.svg -->
    <path d="M133.73,217.5c49.7-1.76,78.83-17.91,100.22-35.07" stroke="#1F1F1F" stroke-width="13.03" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Drifting Z's — upright (NOT rotated with Zop). Muted white, ascending sizes. -->
  <g fill="rgba(255,255,255,0.5)">
    <text x="290" y="105" font-size="46" font-weight="900" font-family="Helvetica">z</text>
    <text x="320" y="65"  font-size="36" font-weight="900" font-family="Helvetica">z</text>
    <text x="346" y="32"  font-size="28" font-weight="900" font-family="Helvetica">z</text>
  </g>
</svg>
