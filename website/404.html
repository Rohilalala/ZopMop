<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0A" />
<title>404 — Page not found · ZopMop</title>
<meta name="description" content="The page you're looking for doesn't exist. Head back home." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="assets/zop/zop-full.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet" />
<style>
  @font-face {
    font-family: 'Qurova';
    src: url('assets/fonts/Qurova-Medium.otf') format('opentype');
    font-weight: 500;
    font-display: swap;
    unicode-range: U+0041-005A, U+0061-007A;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0A0A0A; color: #fff; font-family: 'Montserrat', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(245,163,0,0.35); }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 50% 50%, rgba(245,163,0,0.16) 0%, transparent 60%),
      radial-gradient(40% 30% at 100% 100%, rgba(255,186,3,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .stage {
    position: relative; z-index: 1;
    text-align: center;
    padding: 32px 24px;
    max-width: 640px;
  }

  .zop {
    width: 200px; height: 200px;
    margin: 0 auto 32px;
    filter: drop-shadow(0 0 32px rgba(245,163,0,0.45));
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  .num {
    font-family: 'Qurova', 'Bricolage Grotesque', 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: clamp(120px, 20vw, 220px);
    line-height: 0.9;
    letter-spacing: -0.06em;
    margin: 0;
    background: linear-gradient(180deg, #FFFFFF 30%, rgba(245,163,0,0.85) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-family: 'Qurova', 'Bricolage Grotesque', 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: -0.03em;
    margin: 0 0 12px;
    color: #fff;
  }
  h1 .m { color: #F5A300; }

  p {
    font-size: 16px;
    color: rgba(255,255,255,0.55);
    line-height: 1.55;
    margin: 0 0 32px;
  }

  .ctas {
    display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  .btn-primary, .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 22px;
    border-radius: 9999px;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.15, 1), background 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary {
    background: #F5A300;
    color: #0A0A0A;
    box-shadow: 0 8px 24px rgba(245,163,0,0.28);
    border: none;
  }
  .btn-primary:hover { transform: translateY(-2px) scale(1.02); background: #FFBA03; }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(245,163,0,0.4); color: #fff; }

  .brand {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Qurova', 'Bricolage Grotesque', 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: -0.04em;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    z-index: 2;
  }
  .brand img { width: 22px; height: 22px; }
  .brand .m { color: #F5A300; }

  @media (max-width: 540px) {
    .zop { width: 160px; height: 160px; }
    .ctas { gap: 10px; }
    .btn-primary, .btn-ghost { height: 44px; padding: 0 18px; font-size: 12px; }
  }
</style>
</head>
<body>

<a href="/" class="brand" aria-label="ZopMop home">
  <img src="assets/zop/zop-full.svg" alt="" />
  <span>Zop<span class="m">Mop</span></span>
</a>

<main class="stage">
  <img class="zop" src="assets/zop/zop-confused.svg" alt="" onerror="this.src='assets/zop/zop-full.svg'" />
  <div class="num">404</div>
  <h1>Zop's <span class="m">lost.</span></h1>
  <p>This page doesn't exist (yet). Maybe Zop's still cleaning it up.</p>
  <div class="ctas">
    <a href="/" class="btn-primary">
      Take me home
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </a>
    <a href="/#waitlist" class="btn-ghost">Join the waitlist</a>
  </div>
</main>

</body>
</html>
